server:
  port: 8085
  servlet:
    context-path: /api/v1

spring:
  application:
    name: loan-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neobank_loan}
    username: ${DB_USERNAME:neobank}
    password: ${DB_PASSWORD:neobank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: loan-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.neobank.*"

neobank:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  loan:
    min-amount: ${LOAN_MIN_AMOUNT:10000}                        # TBD in PRD - placeholder
    max-amount: ${LOAN_MAX_AMOUNT:5000000}                      # TBD in PRD - placeholder
    min-tenure-months: 6
    max-tenure-months: 360
    default-annual-rate: ${LOAN_DEFAULT_RATE:10.5}              # TBD in PRD - placeholder
  kafka-topics:
    loan-submitted: loan.submitted
    loan-decided: loan.decided
    audit: audit.events
  clients:
    account:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8082/api/v1}
    ai:
      url: ${AI_SERVICE_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.neobank: ${LOG_LEVEL:DEBUG}
