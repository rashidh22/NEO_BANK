server:
  port: 8086
  servlet:
    context-path: /api/v1

spring:
  application:
    name: statement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neobank_statement}
    username: ${DB_USERNAME:neobank}
    password: ${DB_PASSWORD:neobank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

neobank:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  statement:
    max-range-days: ${STATEMENT_MAX_DAYS:366}                   # TBD in PRD - placeholder
    async-threshold-days: 90
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:neobank-statements}
  clients:
    account:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8082/api/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.neobank: ${LOG_LEVEL:DEBUG}
