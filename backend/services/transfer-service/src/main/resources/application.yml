server:
  port: 8084
  servlet:
    context-path: /api/v1

spring:
  application:
    name: transfer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neobank_transfer}
    username: ${DB_USERNAME:neobank}
    password: ${DB_PASSWORD:neobank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: transfer-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.neobank.*"

neobank:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  transfer:
    max-amount: ${TRANSFER_MAX_AMOUNT:200000}                   # TBD in PRD - placeholder
    hold-expiry-minutes: 30
    fail-safe-hold-when-fraud-unavailable: true
  otp:
    length: 6
    ttl-seconds: ${OTP_TTL_SECONDS:300}                         # TBD in PRD - placeholder
    max-attempts: ${OTP_MAX_ATTEMPTS:3}                         # TBD in PRD - placeholder
  fraud:
    high-risk-score: ${FRAUD_HIGH_SCORE:70}                     # TBD in PRD - placeholder
    timeout-ms: 300
  scheduler:
    poll-cron: "0 * * * * *"
    batch-size: 100
  kafka-topics:
    transfer-completed: transfer.completed
    transfer-held: transfer.held
    audit: audit.events
  clients:
    account:
      url: ${ACCOUNT_SERVICE_URL:http://localhost:8082/api/v1}
    beneficiary:
      url: ${BENEFICIARY_SERVICE_URL:http://localhost:8083/api/v1}
    ai:
      url: ${AI_SERVICE_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.neobank: ${LOG_LEVEL:DEBUG}
